<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{{ titulo }}</title>
</head>
<body>
    <h1>{{ titulo }}</h1>
    <p>{{ mensaje }}</p>
    <hr>
    <h3>Roles Registrados:</h3>
    <ul>
        {% for rol in roles %}
            <li><strong>{{ rol.nombre }}</strong> - {{ rol.descripcion|default:"Sin descripción" }}</li>
        {% empty %}
            <li>No hay roles registrados.</li>
        {% endfor %}
    </ul>
</body>
</html>
